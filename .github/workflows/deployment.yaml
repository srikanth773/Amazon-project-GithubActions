name: terraform infra + deploy asp dotnet project
on:
    workflow_dispatch:
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3
            - name: login to azure
              uses: azure/login@v1
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: terraform setup
              uses: hashicorp/setup-terraform@v3
            # - name: cd to terraform
            #   run: cd terraform
            - name: terraform init
            #   working-directory: terraform
              run: terraform init
            - name: terraform apply
              working-directory: terraform
              run: terraform apply --auto-approve
            - name: setup dotnet
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 8.0.x
            - name: publish application
              run: dotnet publish Amazon.csproj -c Release -o publish --no-restore
            - name: deploy to web app
              uses: azure/webapps-deploy@v2
              with:
                app-name: 'Ghubamazon0361'
                package: publish
            
            